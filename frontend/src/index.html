<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KatHub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        katRed: '#e63946',
                        katRedHover: '#d62839',
                        katDark: '#0f0f13',
                        katDarkGrad: '#15151c',
                        katCard: '#1a1a22',
                        katCardInner: '#23232d',
                        katBtnGray: '#2a2a35',
                        katBtnGrayHover: '#32323d',
                        katTextMuted: '#888888',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulseOpacity {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-fast {
            animation: pulseOpacity 1.2s infinite ease-in-out;
        }
        body {
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #0f0f13 0%, #15151c 100%);
            height: 100vh;
            overflow: hidden;
        }
        /* Custom scrollbar if ever needed */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a35;
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-white flex flex-col justify-between p-5 box-border">

    <!-- Top Bar: Title + Subtitle (Left) & Version + Update Notification (Right) -->
    <header class="flex justify-between items-start select-none">
        <div>
            <h1 class="text-2xl font-bold text-[#e63946] tracking-wide leading-none">KatHub</h1>
            <p class="text-xs text-[#888888] mt-1 ml-0.5">Private Utilities</p>
        </div>

        <div class="flex flex-col items-end">
            <span id="lblVersion" class="text-xs text-gray-500 font-mono"></span>
            
            <button id="lblUpdate" 
                    onclick="handleUpdateClick()"
                    class="hidden flex items-center gap-1.5 text-xs font-semibold text-emerald-400 bg-emerald-950/40 border border-emerald-500/30 px-2 py-0.5 rounded mt-1 cursor-pointer hover:bg-emerald-900/50 transition-all animate-pulse-fast focus:outline-none">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span id="lblUpdateText">Actualización disponible</span>
            </button>
        </div>
    </header>

    <!-- Main Panel Container -->
    <main class="bg-[#1a1a22] rounded-[10px] p-5 my-auto flex flex-col gap-3 shadow-2xl border border-white/5">

        <!-- 1. KatPlugins Section -->
        <div class="bg-[#23232d] rounded-lg p-3.5 flex items-center justify-between border border-white/5">
            <div class="flex items-center gap-3">
                <span class="text-base font-semibold text-white tracking-tight">KatPlugins</span>
            </div>

            <div class="flex items-center gap-2">
                <!-- Uninstall circular button -->
                <button id="uninstallKatButton"
                        onclick="handleUninstallKatPlugins()"
                        title="Uninstall Plugins"
                        class="hidden w-7 h-7 rounded-full bg-[#2a2a35] text-[#888] hover:text-[#e63946] hover:bg-[#32323d] items-center justify-center transition-all duration-150 focus:outline-none cursor-pointer">
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                </button>

                <!-- Status Label -->
                <span id="katPluginsStatusLabel" class="text-sm font-semibold mr-1 transition-colors">
                    Checking...
                </span>

                <!-- Main Action Button -->
                <button id="katPluginsMainButton"
                        onclick="handleKatPluginsMainAction()"
                        class="w-[100px] h-[30px] rounded-md text-sm font-medium transition-all duration-150 cursor-pointer flex items-center justify-center focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                    Install
                </button>
            </div>
        </div>

        <!-- KatProgressBar -->
        <div id="katProgressBarContainer" class="hidden w-full bg-[#15151c] rounded-full h-1.5 overflow-hidden -mt-1.5">
            <div id="katProgressBar" class="bg-[#e63946] h-full transition-all duration-150" style="width: 0%"></div>
        </div>

        <!-- 2. KatAccountManager Section -->
        <div class="bg-[#23232d] rounded-lg p-3.5 flex items-center justify-between border border-white/5">
            <span class="text-base font-semibold text-white tracking-tight">KatAccountManager</span>
            
            <div class="flex items-center gap-2">
                <button id="accountManagerBtn"
                        onclick="handleAccountManagerClick()"
                        class="w-[100px] h-[30px] rounded-md text-sm font-medium bg-[#2a2a35] text-[#888] hover:bg-[#32323d] hover:text-white transition-colors cursor-pointer flex items-center justify-center focus:outline-none">
                    Unavailable
                </button>
            </div>
        </div>

        <!-- 3. LOL Config Locker Section -->
        <div class="bg-[#23232d] rounded-lg p-3.5 flex items-center justify-between border border-white/5">
            <span class="text-base font-semibold text-white tracking-tight">LOL config locker</span>

            <div class="flex items-center gap-2">
                <span id="lolConfigStatusLabel" class="text-sm font-semibold mr-1 transition-colors">
                    Checking...
                </span>

                <button id="lolConfigButton"
                        onclick="handleLolConfigToggle()"
                        class="w-[100px] h-[30px] rounded-md text-sm font-medium bg-[#e63946] text-white hover:bg-[#d62839] transition-colors cursor-pointer flex items-center justify-center focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                    Lock
                </button>
            </div>
        </div>

    </main>

    <!-- Modal Dialog / Toast Overlay -->
    <div id="customModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
        <div class="bg-[#1e1e28] border border-white/10 rounded-xl max-w-sm w-full p-5 shadow-2xl">
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-2">KatHub</h3>
            <p id="modalMessage" class="text-sm text-gray-300 mb-5 leading-relaxed"></p>
            <div id="modalButtons" class="flex justify-end gap-3">
                <!-- Buttons injected dynamically -->
            </div>
        </div>
    </div>

    <!-- App Logic & Wails Bindings -->
    <script src="main.js"></script>
</body>
</html>
